# PV Summary – fertiges Dashboard
#
# Einbinden:
#   1. Einstellungen → Dashboards → Dashboard hinzufügen → „Neues Dashboard von Grund auf“
#   2. Dashboard öffnen → Stift (Bearbeiten) → ⋮ → „Rohkonfigurationseditor“
#   3. Gesamten Inhalt ersetzen durch diese Datei → Speichern
#
# Entity-IDs: Die Beispiele gehen von einer Anlage namens „PV Anlage“ aus
# (Präfix sensor.pv_anlage_…). Bei anderem Namen das Präfix per Suchen/Ersetzen anpassen.
# Ohne Akku: den Abschnitt „Akku“ in der Ansicht „Übersicht“ und die Ansicht „Akku“ löschen.

title: PV Summary
views:
  - title: Übersicht
    path: pv
    icon: mdi:solar-power-variant
    type: sections
    max_columns: 4
    badges:
      - type: entity
        entity: sensor.pv_anlage_aktuelle_leistung
        name: Leistung
        show_name: true
        color: amber
      - type: entity
        entity: sensor.pv_anlage_produktion_heute
        name: Heute
        show_name: true
        icon: mdi:solar-power
        color: green
      - type: entity
        entity: sensor.pv_anlage_produktionszeit_heute
        name: Laufzeit
        show_name: true
        icon: mdi:timer-sand
        color: grey
      - type: entity
        entity: sensor.pv_anlage_akkustand
        name: Akku
        show_name: true
        visibility:
          - condition: numeric_state
            entity: sensor.pv_anlage_akkustand
            above: -1
    sections:
      # ---------------------------------------------------------------- Jetzt
      - type: grid
        cards:
          - type: heading
            heading: Jetzt
            icon: mdi:white-balance-sunny
          - type: gauge
            entity: sensor.pv_anlage_aktuelle_leistung
            name: Aktuelle Leistung
            min: 0
            max: 2000
            needle: true
            segments:
              - from: 0
                color: '#9e9e9e'
              - from: 100
                color: '#fbc02d'
              - from: 600
                color: '#ff9800'
              - from: 1200
                color: '#43a047'
            grid_options:
              columns: full
          - type: tile
            entity: sensor.pv_anlage_spitzenleistung_heute
            name: Spitze heute
            icon: mdi:flash
            color: orange
          - type: tile
            entity: sensor.pv_anlage_durchschnittsleistung_heute
            name: Ø Leistung
            icon: mdi:chart-bell-curve-cumulative
            color: yellow
          - type: tile
            entity: sensor.pv_anlage_produktion_heute
            name: Heute
            icon: mdi:solar-power
            color: amber
          - type: tile
            entity: sensor.pv_anlage_produktion_gestern
            name: Gestern
            icon: mdi:calendar-arrow-left
            color: grey

      # ---------------------------------------------------------------- Verlauf
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Verlauf
            icon: mdi:chart-areaspline
          - type: history-graph
            title: Leistung (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.pv_anlage_aktuelle_leistung
                name: PV
            grid_options:
              columns: full
          - type: statistics-graph
            title: Tagesproduktion (30 Tage)
            entities:
              - entity: sensor.pv_anlage_gesamtproduktion
                name: Produktion
            stat_types:
              - change
            period: day
            days_to_show: 30
            chart_type: bar
            grid_options:
              columns: full
          - type: statistics-graph
            title: Monatsproduktion (12 Monate)
            entities:
              - entity: sensor.pv_anlage_gesamtproduktion
                name: Produktion
            stat_types:
              - change
            period: month
            days_to_show: 365
            chart_type: bar
            grid_options:
              columns: full

      # ---------------------------------------------------------------- Produktion
      - type: grid
        cards:
          - type: heading
            heading: Produktion
            icon: mdi:lightning-bolt
          - type: tile
            entity: sensor.pv_anlage_produktion_diese_woche
            name: Diese Woche
            icon: mdi:calendar-week
            color: light-green
          - type: tile
            entity: sensor.pv_anlage_produktion_dieser_monat
            name: Dieser Monat
            icon: mdi:calendar-month
            color: green
          - type: tile
            entity: sensor.pv_anlage_produktion_letzter_monat
            name: Letzter Monat
            icon: mdi:calendar-arrow-left
            color: teal
          - type: tile
            entity: sensor.pv_anlage_produktion_dieses_jahr
            name: Dieses Jahr
            icon: mdi:calendar-star
            color: cyan
          - type: tile
            entity: sensor.pv_anlage_gesamtproduktion
            name: Gesamt
            icon: mdi:sigma
            color: blue
            grid_options:
              columns: full

          - type: heading
            heading: Durchschnitt & Rekorde
            heading_style: subtitle
          - type: tile
            entity: sensor.pv_anlage_o_tagesproduktion_7_tage
            name: Ø 7 Tage
            icon: mdi:numeric-7-box-outline
            color: purple
            vertical: true
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.pv_anlage_o_tagesproduktion_30_tage
            name: Ø 30 Tage
            icon: mdi:calendar-range
            color: deep-purple
            vertical: true
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.pv_anlage_o_tagesproduktion_gesamt
            name: Ø Gesamt
            icon: mdi:chart-line
            color: indigo
            vertical: true
            grid_options:
              columns: 4
          - type: tile
            entity: sensor.pv_anlage_bester_tag
            name: Bester Tag
            icon: mdi:trophy
            color: amber
          - type: tile
            entity: sensor.pv_anlage_spitzenleistung_rekord
            name: Leistungsrekord
            icon: mdi:trophy-award
            color: red

      # ---------------------------------------------------------------- Akku
      - type: grid
        visibility:
          - condition: numeric_state
            entity: sensor.pv_anlage_akkustand
            above: -1
        cards:
          - type: heading
            heading: Akku
            icon: mdi:home-battery
            tap_action:
              action: navigate
              navigation_path: akku
          - type: gauge
            entity: sensor.pv_anlage_akkustand
            name: Akkustand
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: '#e53935'
              - from: 20
                color: '#fb8c00'
              - from: 40
                color: '#fdd835'
              - from: 70
                color: '#43a047'
            grid_options:
              columns: full
          - type: tile
            entity: sensor.pv_anlage_akku_ladeleistung
            name: Laden
            icon: mdi:battery-charging
            color: green
          - type: tile
            entity: sensor.pv_anlage_akku_entladeleistung
            name: Entladen
            icon: mdi:battery-minus
            color: orange
          - type: tile
            entity: sensor.pv_anlage_akkuspannung
            name: Spannung
            icon: mdi:sine-wave
            color: blue
          - type: tile
            entity: sensor.pv_anlage_akkutemperatur
            name: Temperatur
            icon: mdi:thermometer
            color: red
          - type: tile
            entity: sensor.pv_anlage_akku_geladen_heute
            name: Geladen heute
            icon: mdi:battery-arrow-up
            color: light-green
          - type: tile
            entity: sensor.pv_anlage_akku_entladen_heute
            name: Entladen heute
            icon: mdi:battery-arrow-down
            color: deep-orange

  # ==================================================================== Akku-Details
  - title: Akku
    path: akku
    icon: mdi:home-battery
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Zustand
            icon: mdi:home-battery
          - type: gauge
            entity: sensor.pv_anlage_akkustand
            name: Akkustand
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: '#e53935'
              - from: 20
                color: '#fb8c00'
              - from: 40
                color: '#fdd835'
              - from: 70
                color: '#43a047'
            grid_options:
              columns: full
          - type: tile
            entity: sensor.pv_anlage_akkuleistung
            name: Leistung (+ Laden / − Entladen)
            icon: mdi:battery-sync
            color: amber
            grid_options:
              columns: full
          - type: tile
            entity: sensor.pv_anlage_akkuspannung
            name: Spannung
            icon: mdi:sine-wave
            color: blue
          - type: tile
            entity: sensor.pv_anlage_akkutemperatur
            name: Temperatur
            icon: mdi:thermometer
            color: red

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Verlauf
            icon: mdi:chart-timeline-variant
          - type: history-graph
            title: Akkustand (48 h)
            hours_to_show: 48
            entities:
              - entity: sensor.pv_anlage_akkustand
                name: Akkustand
            grid_options:
              columns: full
          - type: history-graph
            title: PV und Akku (24 h)
            hours_to_show: 24
            entities:
              - entity: sensor.pv_anlage_aktuelle_leistung
                name: PV
              - entity: sensor.pv_anlage_akku_ladeleistung
                name: Laden
              - entity: sensor.pv_anlage_akku_entladeleistung
                name: Entladen
            grid_options:
              columns: full
          - type: history-graph
            title: Spannung und Temperatur (48 h)
            hours_to_show: 48
            entities:
              - entity: sensor.pv_anlage_akkuspannung
                name: Spannung
              - entity: sensor.pv_anlage_akkutemperatur
                name: Temperatur
            grid_options:
              columns: full

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Energie
            icon: mdi:lightning-bolt
          - type: tile
            entity: sensor.pv_anlage_akku_geladen_heute
            name: Geladen heute
            icon: mdi:battery-arrow-up
            color: light-green
          - type: tile
            entity: sensor.pv_anlage_akku_entladen_heute
            name: Entladen heute
            icon: mdi:battery-arrow-down
            color: deep-orange
          - type: tile
            entity: sensor.pv_anlage_akku_geladen_gesamt
            name: Geladen gesamt
            icon: mdi:battery-arrow-up-outline
            color: green
          - type: tile
            entity: sensor.pv_anlage_akku_entladen_gesamt
            name: Entladen gesamt
            icon: mdi:battery-arrow-down-outline
            color: orange
          - type: statistics-graph
            title: Laden und Entladen pro Tag (30 Tage)
            entities:
              - entity: sensor.pv_anlage_akku_geladen_gesamt
                name: Geladen
              - entity: sensor.pv_anlage_akku_entladen_gesamt
                name: Entladen
            stat_types:
              - change
            period: day
            days_to_show: 30
            chart_type: bar
            grid_options:
              columns: full
